<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./output.css" />
  </head>
  <body>
    <header
      class="lg:flex items-center justify-between px-10 py-4 bg-white border-b border-gray-100 max-w-300 m-auto"
    >
      <div class="flex items-center gap-2">
        <img src="./img/Logo (10).png" alt="" />
      </div>

      <div class="flex-1 max-w-md mx-10">
        <div class="relative">
          <input
            type="text"
            placeholder="Search bar"
            class="w-full py-2 px-4 border border-gray-300 rounded-lg focus:outline-none"
          />
          <span class="absolute right-3 top-2.5 text-gray-400"
            ><img src="./img/Search.png" alt=""
          /></span>
        </div>
      </div>

      <div class="lg:flex items-center gap-8 text-slate-700 font-medium">
        <div class="flex items-center gap-1 cursor-pointer">
          Category <span class="text-xs">▼</span>
        </div>
        <a href="#" class="hover:text-blue-600">Become an Mentor</a>

        <div class="flex items-center gap-4">
          <button
            class="px-8 py-2 border border-slate-800 rounded-lg hover:bg-slate-50"
          >
            Login
          </button>
          <button
            class="px-8 py-2 bg-pink-500 text-white rounded-lg hover:bg-pink-600 transition"
          >
            Sign Up
          </button>
        </div>
      </div>
    </header>
    <section
      class="bg-[#020d1f] text-white py-16 px-10 flex items-center min-h-[500px]"
    >
      <div
        class="container mx-auto grid grid-cols-1 md:grid-cols-2 gap-12 items-center"
      >
        <div class="space-y-8">
          <h1 class="text-6xl font-bold leading-tight">
            Find the Best <br />
            Courses and <br />
            Amazing Mentor
          </h1>

          <p class="text-gray-400 max-w-lg">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit ut aliquam,
            purus sit amet luctus venenatis, lectus magna fringilla urna,
            porttitor rhoncus.
          </p>

          <div class="bg-white p-2 rounded-xl flex items-center max-w-md">
            <img src="./img/Search.png" alt="" />
            <input
              type="text"
              placeholder="Type in the course you want to learn"
              class="w-full py-2 outline-none text-gray-800"
            />
            <button
              class="bg-[#ff2d81] hover:bg-pink-600 text-white px-8 py-3 rounded-lg font-semibold transition"
            >
              Search
            </button>
          </div>

          <div class="flex gap-8 pt-4">
            <div class="flex items-center gap-2 text-sm">
              <img src="./img/Life Time Acces.png" alt="" />
            </div>
            <div class="flex items-center gap-2 text-sm">
              <img src="./img/Expert Mentor.png" alt="" />
            </div>
            <div class="flex items-center gap-2 text-sm">
              <img src="./img/100K+ Courses.png" alt="" />
            </div>
          </div>
        </div>

        <div class="relative flex justify-center">
          <div
            class="w-[400px] h-[500px] bg-[#E5E5E5] rounded-md relative overflow-hidden"
          >
            <div
              class="absolute top-10 left-10 p-3 rounded-lg rotate-[-15deg] shadow-lg"
            >
              <img src="./img/Bell Icon.png" alt="" />
            </div>
            <div
              class="absolute bottom-40 left-5 bg-slate-900 p-3 rounded-lg rotate-[10deg] shadow-lg"
            >
              <img src="./img/Love Icon.png" alt="" />
            </div>
            <div
              class="absolute top-1/2 -right-5 bg-pink-500 p-3 rounded-lg rotate-[20deg] shadow-lg"
            >
              <img src="./img/Verification Icon.png" alt="" />
            </div>

            <div
              class="absolute bottom-10 right-10 bg-white p-4 rounded-xl shadow-2xl text-center"
            >
              <img class="w-[50%]" src="./img/Review (1).png" alt="" />
            </div>
          </div>
        </div>
      </div>
    </section>
    <section class="py-16 bg-white">
      <div class="container mx-auto text-center">
        <h2 class="text-4xl font-bold text-[#1e2e4d] mb-10">
          Trending Courses
        </h2>

        <div
          class="flex flex-wrap justify-center items-center gap-4 md:gap-12 text-gray-400 font-medium"
        >
          <button
            class="bg-[#ff2d81] text-white px-10 py-3 rounded-lg shadow-md transition hover:bg-pink-600"
          >
            All
          </button>

          <button class="hover:text-[#1e2e4d] transition duration-300">
            Business
          </button>
          <button class="hover:text-[#1e2e4d] transition duration-300">
            Art & Design
          </button>
          <button class="hover:text-[#1e2e4d] transition duration-300">
            Development
          </button>
          <button class="hover:text-[#1e2e4d] transition duration-300">
            Marketing
          </button>
        </div>
      </div>
    </section>
  </body>
</html>
