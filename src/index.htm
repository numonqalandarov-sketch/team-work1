<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./output.css" />
  </head>
  <body>
    <header
      class="flex items-center justify-between px-10 py-4 bg-white border-b border-gray-100 max-w-300 m-auto"
    >
      <div class="flex items-center gap-2">
       <img src="./img/Logo (10).png" alt="">
      </div>

      <div class="flex-1 max-w-md mx-10">
        <div class="relative">
          <input
            type="text"
            placeholder="Search bar"
            class="w-full py-2 px-4 border border-gray-300 rounded-lg focus:outline-none"
          />
          <span class="absolute right-3 top-2.5 text-gray-400"><img src="./img/Search.png" alt=""></span>
        </div>
      </div>

      <div class="flex items-center gap-8 text-slate-700 font-medium">
        <div class="flex items-center gap-1 cursor-pointer">
          Category <span class="text-xs">▼</span>
        </div>
        <a href="#" class="hover:text-blue-600">Become an Mentor</a>

        <div class="flex items-center gap-4">
          <button
            class="px-8 py-2 border border-slate-800 rounded-lg hover:bg-slate-50"
          >
            Login
          </button>
          <button
            class="px-8 py-2 bg-pink-500 text-white rounded-lg hover:bg-pink-600 transition"
          >
            Sign Up
          </button>
        </div>
      </div>
    </header>
  </body>
</html>
